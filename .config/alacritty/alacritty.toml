[env]
TERM = "tmux-256color"

[general]
live_config_reload = true

[window]
#decorations = "None"
dimensions = { columns = 120, lines = 35 }
padding = {x = 10, y = 10}
#opacity = 0.9
title = "Terminal | Alacritty"
dynamic_title = false
startup_mode = "Maximized"

[colors.primary]
foreground = "#ededed"
background = "#272930"

[colors.normal]
black = '#2e303e'
red = '#e27878'
green = '#b4be82'
yellow = '#e3a86b'
blue = '#84a0c6'
magenta = '#a093c7'
cyan = '#89b8c2'
white = '#c6c8d1'

[colors.bright]
black = '#3f414f'
red = '#ec8989'
green = '#c1d18a'
yellow = '#f0b87a'
blue = '#91b4d8'
magenta = '#b3a1e6'
cyan = '#9acfe0'
white = '#e0e2ea'

[cursor]
style = { shape ="Beam", blinking = "On" }
unfocused_hollow = false
thickness = 0.20

[mouse]
hide_when_typing = false

[font]
normal = { family = "CaskaydiaMono Nerd Font"}
bold = { family = "CaskaydiaMono Nerd Font"}
italic = { family = "CaskaydiaMono Nerd Font"}
bold_italic = { family = "CaskaydiaMono Nerd Font"}
