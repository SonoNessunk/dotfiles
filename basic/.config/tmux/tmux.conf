# cambio il prefix da CTRL + b a CTRL + d
unbind C-b
set -g prefix C-d
bind C-d send-prefix

# permette di usare il mouse
set -g mouse off

# permette di aprire due terminale sulla stessa sessione ma con dimensioni diverse
setw -g aggressive-resize on

# imposta l'indicizazione partendo da 1
set -g base-index 1
setw -g pane-base-index 1

# imposta la status bar al top
set -g status-position top

# imposta una grandezza maggiore per in nome della sessione
set -g status-left-length 20

# fa si che quando si elemina una finestra vengono riordinate
set -g renumber-windows on

# fkn hell, fa si che i colori funzionino
set -g default-terminal "$TERM" 
set -ga terminal-overrides ",$TERM*:Tc" 
set -g default-command "$SHELL"

# permette di ricaricare il config al volo con prefix - Ctrl + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."
# permettono di aggiungere un passaggio in piu nella creazione delle finestre e sessioni chiedendo il nome
bind e command-prompt -p "Enter session name:" "new-session -s '%%'"
bind c command-prompt -p "Enter window name:" "new-window -n '%%'"

bind-key v split-window -v
bind-key b split-window -h

# tema di tmux
source-file ~/.config/tmux/tmux.theme


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
